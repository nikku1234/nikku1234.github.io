---
layout: page
title: My Journey
subtitle: "The road so far..."
---

<div class="experience-container">
    <div class="road-path">
        <!-- SVG Road will go here -->
        <svg class="road-svg" viewBox="0 0 100 1000" preserveAspectRatio="none">
            <path d="M50,0 Q50,200 80,400 T50,800 T20,1200" fill="none" class="road-line" />
        </svg>
    </div>

    <div class="timeline">
        {% for item in site.data.experience %}
        <div class="timeline-item">
            <div class="timeline-content">
                <div class="timeline-date">{{ item.date }}</div>
                <h3 class="timeline-title">{{ item.title }}</h3>
                <div class="timeline-role">{{ item.role }}</div>
                <p>{{ item.description }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<style>
    .experience-container {
        position: relative;
        padding: 60px 0;
        overflow: hidden;
    }

    .road-path {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 600px;
        height: 100%;
        z-index: 0;
        opacity: 0.1;
        pointer-events: none;
    }

    .road-svg {
        width: 100%;
        height: 100%;
    }

    .road-line {
        stroke: #000;
        stroke-width: 4;
        stroke-dasharray: 20, 20;
        animation: dash 50s linear infinite;
    }

    @keyframes dash {
        to {
            stroke-dashoffset: 1000;
        }
    }

    .timeline {
        position: relative;
        max-width: 800px;
        margin: 0 auto;
        z-index: 1;
    }

    .timeline-item {
        margin-bottom: 60px;
        opacity: 0;
        transform: translateY(30px);
        transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .timeline-item.in-view {
        opacity: 1;
        transform: translateY(0);
    }

    .timeline-content {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 32px;
        border-radius: 20px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.4);
        transition: transform 0.3s ease;
    }

    .timeline-content:hover {
        transform: scale(1.02);
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.1);
    }

    .timeline-date {
        font-weight: 600;
        color: #86868b;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-size: 13px;
    }

    .timeline-title {
        margin-top: 0;
        margin-bottom: 4px;
        font-size: 24px;
    }

    .timeline-role {
        color: #0071e3;
        font-weight: 500;
        margin-bottom: 16px;
        font-size: 17px;
    }

    /* Alternating layout for larger screens */
    @media (min-width: 768px) {
        .timeline-item {
            width: 45%;
        }

        .timeline-item:nth-child(odd) {
            margin-left: auto;
        }

        .timeline-item:nth-child(even) {
            margin-right: auto;
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('in-view');
                }
            });
        }, {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        });

        document.querySelectorAll('.timeline-item').forEach(item => {
            observer.observe(item);
        });
    });
</script>
